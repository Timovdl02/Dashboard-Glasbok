<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orderstatus WO10128</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1b1f27; --muted: #667085; --line: #e3e6ec;
    --ok: #1a7f4b; --ok-bg: #e3f4ea; --warn: #b26a00; --warn-bg: #fff1d6;
    --bad: #c0362c; --bad-bg: #fde7e5; --info: #2457c5; --info-bg: #e5edfc; --accent: #2457c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e8ebf1; --muted: #98a2b3; --line: #2b3240;
      --ok: #4cc38a; --ok-bg: #16352a; --warn: #f0b04a; --warn-bg: #3a2c12;
      --bad: #ff7b70; --bad-bg: #3d1c1a; --info: #7aa2ff; --info-bg: #1c2a4a; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 28px; font-weight: 650; margin-top: 2px; }
  .kpi .note { color: var(--muted); font-size: 13px; }
  .bad { color: var(--bad); } .ok { color: var(--ok); } .warn { color: var(--warn); }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 550; }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-info { background: var(--info-bg); color: var(--info); }
  .progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; background: var(--ok); }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .step { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; position: relative; }
  .step .n { color: var(--muted); font-size: 12px; }
  .step .name { font-weight: 600; }
  .step .open { font-size: 22px; font-weight: 650; margin-top: 4px; }
  .step.current { border-color: var(--accent); background: var(--info-bg); }
  .step.current .tag { position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--accent); font-weight: 650; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  .toolbar input[type=checkbox] { padding: 0; }
  .toolbar label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.short td:first-child { box-shadow: inset 3px 0 var(--bad); }
  .art { font-weight: 600; } .desc { color: var(--muted); font-size: 13px; }
  ul.log { list-style: none; padding: 0; margin: 0; }
  ul.log li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  ul.log li:last-child { border: 0; } ul.log .d { color: var(--muted); font-size: 13px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>Voortgang per processtap (open batches)</h2>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card">
    <h2>Materiaal</h2>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Zoek artikel of omschrijving…">
      <select id="statusFilter"><option value="">Alle statussen</option></select>
      <label><input type="checkbox" id="onlyShort"> Alleen tekort</label>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Artikel</th><th class="num">Gepland</th><th>Geplande datum</th><th>Status</th>
          <th class="num">Verwacht</th><th class="num">Op voorraad</th><th>Bestelling</th><th>Tekort</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Logboek</h2>
    <ul class="log" id="log"></ul>
  </section>

  <footer>Snapshot uit Google Sheet “Tracy – order WO10128 / PR2787”. Werk <code>data.js</code> bij om de status te verversen.</footer>
</main>

<script src="data.js"></script>
<script>
(function () {
  var o = window.ORDER;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  var mat = o.materiaal.map(function (r) {
    return { artikel: r[0], omschrijving: r[1], gepland: r[2], eenheid: r[3], datum: r[4], status: r[5], verwacht: r[6], voorraad: r[7], bestelling: r[8], tekort: r[9] === "ja" };
  });
  var shortCount = mat.filter(function (m) { return m.tekort; }).length;
  var received = mat.filter(function (m) { return m.status === "Ontvangen"; }).length;
  var pct = o.totaal ? Math.round(o.klaar / o.totaal * 100) : 0;

  $("title").textContent = "Orderstatus " + o.werkorder + " / " + o.pr;
  $("sub").textContent = o.artikel + " · Production request " + o.productionRequestId;

  $("kpis").innerHTML =
    '<div class="kpi"><div class="label">Batches klaar</div><div class="value">' + o.klaar + ' / ' + o.totaal + '</div>' +
      '<div class="progress"><div style="width:' + pct + '%"></div></div><div class="note">' + pct + '% afgerond</div></div>' +
    '<div class="kpi"><div class="label">Huidige stap</div><div class="value">' + esc(o.huidigeStap) + '</div>' +
      '<div class="note">Sinds ' + esc(o.sinds) + '</div></div>' +
    '<div class="kpi"><div class="label">Materiaaltekort</div><div class="value ' + (shortCount ? "bad" : "ok") + '">' + shortCount + ' van ' + mat.length + '</div>' +
      '<div class="note">regels op tekort (Exact)</div></div>' +
    '<div class="kpi"><div class="label">Materiaal ontvangen</div><div class="value">' + received + ' / ' + mat.length + '</div>' +
      '<div class="note">regels volledig ontvangen</div></div>';

  var badges = o.status.split(";").map(function (s) {
    s = s.trim();
    var cls = /tekort/i.test(s) ? "b-bad" : /lopend|in_progress/i.test(s) ? "b-info" : "b-ok";
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }).join("");
  $("kpis").insertAdjacentHTML("beforebegin", '<div class="badges" style="margin:-8px 0 16px">' + badges +
    '<span class="badge b-warn">Laatst gecontroleerd ' + esc(o.laatstGecontroleerd) + '</span></div>');

  $("steps").innerHTML = o.stappen.map(function (s) {
    var cur = s.naam === o.huidigeStap;
    return '<div class="step' + (cur ? " current" : "") + '">' + (cur ? '<span class="tag">HUIDIG</span>' : "") +
      '<div class="n">Stap ' + s.volgorde + ' van ' + o.stappen.length + '</div><div class="name">' + esc(s.naam) + '</div>' +
      '<div class="open">' + s.open + '</div></div>';
  }).join("");

  var statuses = Array.from(new Set(mat.map(function (m) { return m.status; })));
  statuses.forEach(function (s) { $("statusFilter").insertAdjacentHTML("beforeend", '<option>' + esc(s) + '</option>'); });

  function statusBadge(s) {
    var cls = s === "Ontvangen" ? "b-ok" : s === "Open" ? "b-bad" : "b-warn";
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }
  function render() {
    var q = $("q").value.toLowerCase(), sf = $("statusFilter").value, os = $("onlyShort").checked;
    var list = mat.filter(function (m) {
      return (!q || (m.artikel + " " + m.omschrijving).toLowerCase().indexOf(q) >= 0) && (!sf || m.status === sf) && (!os || m.tekort);
    });
    $("rows").innerHTML = list.length ? list.map(function (m) {
      return '<tr class="' + (m.tekort ? "short" : "") + '"><td><div class="art">' + esc(m.artikel) + '</div><div class="desc">' + esc(m.omschrijving) + '</div></td>' +
        '<td class="num">' + esc(m.gepland) + ' ' + esc(m.eenheid) + '</td><td>' + esc(m.datum) + '</td><td>' + statusBadge(m.status) + '</td>' +
        '<td class="num ' + (parseFloat(String(m.verwacht).replace(",", ".")) < 0 ? "bad" : "") + '">' + esc(m.verwacht || "–") + '</td>' +
        '<td class="num ' + (parseFloat(String(m.voorraad).replace(",", ".")) < 0 ? "bad" : "") + '">' + esc(m.voorraad || "–") + '</td>' +
        '<td>' + esc(m.bestelling || "–") + '</td>' +
        '<td>' + (m.tekort ? '<span class="badge b-bad">Tekort</span>' : '<span class="badge b-ok">OK</span>') + '</td></tr>';
    }).join("") : '<tr><td colspan="8" class="desc">Geen regels gevonden.</td></tr>';
  }
  ["q", "statusFilter", "onlyShort"].forEach(function (id) { $(id).addEventListener("input", render); });
  render();

  $("log").innerHTML = o.log.map(function (l) {
    return '<li><div class="d">' + esc(l.datum) + '</div>' + esc(l.opmerking) + '</li>';
  }).join("");
})();
</script>
</body>
</html>
